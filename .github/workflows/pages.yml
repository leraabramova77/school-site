name: Варианты дизайна на GitHub Pages

# Публикуется только папка design-variants — статичные прототипы на выдуманных данных — и страница-переход app/
# на запущенное приложение. Его адрес — переменная репозитория APP_URL; после её смены: gh workflow run pages.yml.
on:
  push:
    branches: [main]
    paths: ["design-variants/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Адрес приложения для страницы-перехода
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: sed -i "s#__APP_URL__#${APP_URL}#" design-variants/app/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: design-variants
      - id: deployment
        uses: actions/deploy-pages@v5
