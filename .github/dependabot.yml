version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Типы Node должны совпадать с версией Node в CI и на Vercel (22 LTS), а не с последней.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
