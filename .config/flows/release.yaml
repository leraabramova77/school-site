# /flow release — выкатить то, что влито в main. Этап выкатки flow feature и bug (за ним — cleanup и close); запускается и
# сам — тогда сессия тоже заканчивается блоком «сессию можно закрывать» (CLAUDE.md → «Конец сессии»).
# Этап выполняется, только если выполнено условие из его note; иначе пропускается с причиной.
# Под деплой проекта: заполни note и run этапов migrate, env, deploy и smoke, когда станет ясно, куда проект выкатывается.
description: Выкатка влитого в main — миграции, переменные окружения в проде, ожидание деплоя, смоук-проверки.
inputs: [merge]
stages:
  - id: sync
    note: >
      Рабочее дерево должно быть чистым. Если в checkout открыта ветка другой задачи — остановись и спроси, не
      переключай.
    run: git switch main && git pull --ff-only && git fetch --prune

  - id: changes
    uses: [merge]
    note: >
      Что выкатываем: коммит из merge, без него — HEAD main (squash-мерж одного PR); влито несколько PR — спроси,
      с какого коммита. По `git show --stat` отметь, какие этапы ниже нужны (условия — в их note), остальные
      пропусти с причиной.
    produces: изменённые файлы и нужные этапы

  - id: migrate
    uses: [changes]
    note: >
      Только если менялась папка миграций БД. Команда миграций проекта (например, `pnpm db:migrate`) — впиши в run,
      когда в проекте появится БД. Запись в прод-БД — только с согласия Леры.

  - id: env
    uses: [changes]
    note: >
      Только если в .env.example появилась переменная, нужная в проде. Значение задаёт Лера в панели хостинга
      (шаги сначала проверить в браузере или по документации); значения секретов не выводить и не передавать
      аргументами командной строки.
    gate: user-approval

  - id: deploy
    note: >
      Дождаться автодеплоя main на хостинге проекта (или запустить его, если деплой ручной) и убедиться, что он
      прошёл; failure — стоп и разбор по журналу деплоя. Нет деплоя у проекта — пропустить с причиной.

  - id: smoke
    note: >
      Проверить прод: сайт отвечает, ключевой сценарий изменения работает (по spec), в журнале нет новых ошибок.
      Нет деплоя — пропустить с причиной.
    produces: отчёт о выкатке
