name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · fsd · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: Steiger (FSD)
        run: pnpm lint:fsd

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      # Сборка не должна требовать секретов: тесты — чистые функции без сети.
      - name: Build
        run: pnpm build
