name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · fsd · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: NEXT_PUBLIC_* без секретов
        run: pnpm lint:env

      - name: Steiger (FSD)
        run: pnpm lint:fsd

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      # Сборка не должна требовать секретов: тесты — чистые функции без сети.
      - name: Build
        run: pnpm build

      # Секреты не должны попасть в JS, который уходит в браузер (ТЗ-1 §4.7).
      - name: В клиентском бандле нет секретов
        run: |
          if grep -rE "SESSION_SECRET|PROXY_SECRET|USER_ID_PEPPER|netschool\.refal\.kg/webapi" .next/static; then
            echo "::error::В .next/static найдены секреты или адрес API дневника"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: e2e (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Скачать gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Вся история без секретов
        run: ./gitleaks git --redact --no-banner .

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Только production-зависимости: уязвимости dev-инструментов без исправления не блокируют PR,
      # их отслеживает Dependabot.
      - run: pnpm audit --prod --audit-level high
