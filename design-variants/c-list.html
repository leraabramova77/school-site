<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вариант C — Спокойный список</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root {
    --bg: #f2f2f6;
    --surface: #ffffff;
    --sep: #e2e2ea;
    --text: #16161d;
    --muted: #74747f;
    --accent: #0b6bcb;
    --accent-soft: #e4effb;
    --g5: #1e9e57;
    --g4: #2470c9;
    --g3: #c27f00;
    --g2: #d93b3b;
    --gd: #8d4fc3;
    --focus: var(--accent);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0f;
    --surface: #1b1b21;
    --sep: #2c2c35;
    --text: #f2f2f6;
    --muted: #9a9aa6;
    --accent: #5aa6ff;
    --accent-soft: #19283b;
    --g5: #3cc47a;
    --g4: #5aa6ff;
    --g3: #e8a63a;
    --g2: #ff6b66;
    --gd: #b685e8;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--text); font: 400 17px/1.4 "Golos Text", system-ui, sans-serif; }
  .app { max-width: 520px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 0; }

  .icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
  .icon:hover:not(:disabled) { background: var(--accent-soft); }
  .icon svg { width: 22px; height: 22px; }

  .top { display: flex; justify-content: flex-end; margin: 0 -10px; }
  h1 { font-weight: 700; font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .subtitle::first-letter { text-transform: uppercase; }

  /* Неделя — как сегментированный переключатель */
  .weekhead { display: flex; align-items: center; margin: 18px -10px 6px; }
  .weekhead p { flex: 1; text-align: center; font-weight: 600; font-size: 15px; }
  .today-btn { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
  .seg { display: grid; grid-template-columns: repeat(6, 1fr); padding: 4px; gap: 2px; border-radius: 16px; background: var(--surface); }
  .day { height: 58px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .day .wd { font-size: 12px; color: var(--muted); }
  .day .n { font-weight: 600; font-size: 18px; line-height: 1.2; }
  .day[aria-current="date"] .n { color: var(--accent); }
  .day[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .n { color: inherit; }
  .day .has { position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.5; }

  .sect { margin-top: 26px; }
  .sect h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 0 16px 7px; }
  .group { list-style: none; background: var(--surface); border-radius: 16px; overflow: clip; }
  .item { position: relative; padding: 13px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--sep); }
  .item h3 { font-weight: 600; font-size: 17px; line-height: 1.3; }
  .item .sub { grid-column: 1; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
  .item .sub b { font-weight: 500; color: var(--text); }
  .grade { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: flex; flex-direction: column; align-items: center; }
  .grade span { min-width: 38px; height: 38px; padding: 0 8px; display: grid; place-items: center; border-radius: 11px; font-weight: 700; font-size: 20px; color: var(--gc); background: color-mix(in oklab, var(--gc) 13%, transparent); }
  .grade span.debt { font-size: 13px; }
  .grade small { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .more { grid-column: 1 / -1; justify-self: start; margin: 6px -8px -6px; min-height: 36px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .more svg { width: 18px; height: 18px; transition: rotate 0.2s; }
  .more[aria-expanded="true"] svg { rotate: 180deg; }
  .details { grid-column: 1 / -1; margin-top: 8px; padding: 12px 14px; border-radius: 12px; background: var(--bg); font-size: 15px; overflow-wrap: anywhere; }
  .details dt { font-size: 13px; color: var(--muted); }
  .details dd { margin: 1px 0 10px; }
  .details dd:last-child { margin-bottom: 0; }

  .empty { margin-top: 26px; padding: 40px 20px; border-radius: 16px; background: var(--surface); text-align: center; }
  .empty b { font-size: 19px; font-weight: 600; }
  .empty p { color: var(--muted); font-size: 15px; margin-top: 4px; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in oklab, var(--surface) 82%, transparent); backdrop-filter: blur(20px) saturate(1.6); border-top: 1px solid var(--sep); }
  .tabs ul { max-width: 520px; margin: 0 auto; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px max(6px, env(safe-area-inset-bottom)); }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; }
  .tabs a[aria-current] { color: var(--accent); }
  .tabs svg { width: 25px; height: 25px; }
  .variants { color: var(--muted); }
</style>
</head>
<body>
<div class="app" id="diary"></div>
<nav class="tabs" aria-label="Разделы">
  <ul>
    <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Сегодня</a></li>
    <li><a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/></svg>Дневник</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Оценки</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>Ещё</a></li>
  </ul>
</nav>
<nav class="variants" aria-label="Варианты дизайна">
  <a href="./">Все варианты</a><a href="a-notebook.html">A · Тетрадь</a><a href="b-subjects.html">B · Цвет предмета</a><a href="c-list.html" aria-current="page">C · Спокойный список</a>
</nav>
<script src="shared/data.js"></script>
<script src="shared/diary.js"></script>
<script>
  const chevL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  const chevR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  const chevD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const gradeVar = (m) => (m === "debt" ? "var(--gd)" : `var(--g${Math.max(2, m)})`);

  mountDiary(document.getElementById("diary"), (s) => {
    const { F } = s;
    const days = s.week.map((d) => `
      <button class="day" data-go="${d}" aria-pressed="${d === s.date}" ${d === s.today ? 'aria-current="date"' : ""} aria-label="${F.wdLong(d)}, ${F.dayMonth(d)}${d === s.today ? ", сегодня" : ""}">
        <span class="wd">${F.wd(d)}</span><span class="n">${F.num(d)}</span>
        ${s.countOf(d) ? '<span class="has" aria-hidden="true"></span>' : ""}
      </button>`).join("");

    const item = (e) => {
      const isOpen = s.open.has(e.id);
      const grade = e.mark === "debt"
        ? `<div class="grade"><span class="debt" style="--gc:${gradeVar("debt")}" role="img" aria-label="Долг">долг</span></div>`
        : e.mark !== undefined
          ? `<div class="grade"><span style="--gc:${gradeVar(e.mark)}" role="img" aria-label="Оценка ${e.mark}${e.weight ? `, вес ${e.weight}` : ""}">${e.mark}</span>${e.weight ? `<small aria-hidden="true">вес ${e.weight}</small>` : ""}</div>`
          : "";
      const sub = e.hw ? F.esc(e.text) : `<b>${F.esc(e.type)}</b>${e.text ? ` · ${F.esc(e.text)}` : ""}`;
      const details = e.details ? `
        <button class="more" data-toggle="${e.id}" aria-expanded="${isOpen}" aria-controls="d-${e.id}">${isOpen ? "Свернуть" : "Подробнее"}${chevD}</button>
        <dl class="details" id="d-${e.id}" ${isOpen ? "" : "hidden"}>${e.details.map((r) => `<dt>${F.esc(r.label)}</dt><dd>${r.html}</dd>`).join("")}</dl>` : "";
      return `<li class="item"><h3>${F.esc(e.subject)}</h3>${grade}<p class="sub">${sub}</p>${details}</li>`;
    };

    const homework = s.entries.filter((e) => e.hw);
    const work = s.entries.filter((e) => !e.hw);
    const section = (title, list) => list.length ? `<section class="sect"><h2>${title}</h2><ul class="group">${list.map(item).join("")}</ul></section>` : "";

    return `
      <div class="top"><button class="icon" data-theme-toggle aria-label="Сменить тему">${moon}</button></div>
      <h1>Дневник</h1>
      <p class="subtitle">${F.wdLong(s.date)}, ${F.dayMonth(s.date)}</p>
      <div class="weekhead">
        <button class="icon" data-week="-1" aria-label="Предыдущая неделя" ${s.canPrev ? "" : "disabled"}>${chevL}</button>
        <p>${F.weekRange(s.monday)}</p>
        ${s.isThisWeek ? "" : '<button class="today-btn" data-today>Сегодня</button>'}
        <button class="icon" data-week="1" aria-label="Следующая неделя" ${s.canNext ? "" : "disabled"}>${chevR}</button>
      </div>
      <div class="seg" role="group" aria-label="Дни недели">${days}</div>
      <main data-day-content>
        ${s.entries.length ? section("Задано на дом", homework) + section("Работа на уроке", work) : '<div class="empty"><b>Заданий нет</b><p>В этот день в дневнике пусто.</p></div>'}
      </main>`;
  });
</script>
</body>
</html>
